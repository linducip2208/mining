name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-tests:
    name: PHP Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, simplexml, fileinfo, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan migrate:fresh --seed --no-interaction --force

      - name: Run tests
        run: php artisan test --compact

      - name: Inventory integrity audit
        run: php artisan inventory:audit-integrity

      - name: Accounting integrity audit
        run: php artisan accounting:audit-integrity

      - name: SEO audit
        run: php artisan seo:generate --dry-run && php artisan seo:audit

  mysql-migrations:
    name: MySQL Migrations + Seed
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mining_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, simplexml, fileinfo, pdo_mysql
          coverage: none

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Migrate on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mining_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan key:generate --no-interaction
          php artisan migrate:fresh --seed --no-interaction --force
          php artisan migrate:status
          php artisan inventory:audit-integrity
          php artisan accounting:audit-integrity

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
